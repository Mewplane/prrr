name: documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'Cargo.lock'
      - 'src/config.rs'
      - 'src/cli.rs'
      - 'src/distribution.rs'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'Cargo.lock'
      - 'src/config.rs'
      - 'src/cli.rs'
      - 'src/distribution.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install locked documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build and exercise the documentation
        run: python scripts/docs-check.py
      - name: Upload the checked site
        uses: actions/upload-artifact@v4
        with:
          name: prrr-documentation
          path: target/docs-site
          if-no-files-found: error
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the real documented CLI
        run: cargo build --locked --bin prrr
      - name: Check TOML examples and isolated provisioning workflows
        run: python scripts/docs-examples-check.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@v4
