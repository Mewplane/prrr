# FRD: specs/frds/FRD-M001-mobile-workspace.md

[package]
name = "prrr-mobile"
version = "0.1.0"
edition = "2021"  # UniFFI 0.29 - keeping 2021 for stability
rust-version = "1.85"
description = "prrr mobile library for iOS and Android"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1.41", features = ["rt-multi-thread", "time"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

# UniFFI generates FFI code which requires unsafe
# [lints.rust]
# unsafe_code = "deny"
